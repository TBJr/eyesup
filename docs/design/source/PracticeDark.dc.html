<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Practice session, dark mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0;background:#121417}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: #121417; color: #ECEAE4; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column">
<header style="display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding: 16px 32px; border-bottom: 1px solid #2A2E35; background: #1B1E23">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="7" fill="none" stroke="#ECEAE4" stroke-width="2.2"></rect><path d="M10 17 L16 11 L22 17" fill="none" stroke="#6E8CFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M13 23 H19" stroke="#ECEAE4" stroke-width="2.2" stroke-linecap="round"></path></svg>
<span style="font-size: 15px; font-weight: 700">Session 12</span>
</div>
<div style="flex: 1 1 260px; max-width: 420px; display: flex; align-items: center; gap: 12px">
<div role="progressbar" aria-valuemin="0" aria-valuemax="24" aria-valuenow="7" aria-label="Line 7 of 24" style="flex: 1; height: 8px; border-radius: 4px; background: #2A2E35; overflow: hidden"><div style="width: 29%; height: 8px; background: #6E8CFF"></div></div>
<span style="font-size: 14px; color: #A3A8B0; white-space: nowrap">Line 7 of 24</span>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<span style="padding: 5px 12px; border-radius: 999px; background: #F2B33D26; border: 1px solid #F2B33D; font-size: 13px; font-weight: 700">Focus: R</span>
<span style="padding: 5px 12px; border-radius: 999px; background: #23272E; font-size: 13px; color: #C9CDD3"><kbd style="font-family: 'JetBrains Mono', monospace; font-size: 12px">Ctrl</kbd> hold to peek</span>
<span style="padding: 5px 12px; border-radius: 999px; background: #23272E; font-size: 13px; color: #C9CDD3"><kbd style="font-family: 'JetBrains Mono', monospace; font-size: 12px">Esc</kbd> pause</span>
</div>
</header>
<main style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 36px 24px 28px">
<div style="width: 100%; max-width: 900px; display: flex; flex-direction: column; align-items: center; gap: 14px; font-family: 'JetBrains Mono', monospace" aria-label="Practice text">
<div style="font-size: 26px; line-height: 36px; color: #ECEAE4; opacity: 0.3">sad kid fled ale</div>
<div style="font-size: 36px; line-height: 50px; display: flex; align-items: center; flex-wrap: wrap; justify-content: center"><span style="color: #ECEAE4">s</span><span style="color: #FF6B7D; background: #FF6B7D26; border-radius: 4px">u</span><span style="color: #ECEAE4">re fi</span><span style="display: inline-block; width: 3px; height: 42px; background: #6E8CFF; border-radius: 2px; margin: 0 1px"></span><span style="color: #ECEAE4; box-shadow: inset 0 -3px 0 #F2B33D">r</span><span style="color: #8A8F98">e rude user lure</span></div>
<div style="font-size: 26px; line-height: 36px; color: #A3A8B0; opacity: 0.6">red rule feel side</div>
</div>
<div style="width: 100%; max-width: 1100px; display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; align-items: flex-start">
<div style="overflow-x: auto; max-width: 100%">
<dc-import name="Keyboard" mode="levels" hands="reach" target="KeyR" unit="50" theme="dark" levels="{{ lv }}" label="Dark keyboard guide; the left index finger reaches from F up to R" hint-size="744px,370px"></dc-import>
</div>
<div style="flex: 1 1 240px; max-width: 300px; display: flex; flex-direction: column; gap: 14px">
<div style="padding: 18px; border-radius: 14px; background: #1B1E23; border: 2px solid #F2B33D; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 700; color: #A3A8B0; letter-spacing: 0.08em; text-transform: uppercase">Next key</span>
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 52px; height: 52px; box-sizing: border-box; border-radius: 8px; background: #F2B33D33; border: 2px solid #F2B33D; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700">R</span><span style="font-size: 16px; line-height: 1.4"><b>Left index</b><br>up and a little left from F</span></div>
</div>
<div style="padding: 16px 18px; border-radius: 14px; background: #1B1E23; border: 1px solid #2A2E35; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.45; color: #C9CDD3">
<span><b style="color: #ECEAE4">Dark mode</b> keeps every finger colour, lifted for contrast on the dark keys.</span>
<span style="color: #A3A8B0">Same layout and behaviour as the light screen.</span>
</div>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var lv = { Space: 'L3', KeyF: 'L3', KeyJ: 'L3', KeyD: 'L3', KeyK: 'L3', KeyS: 'L2', KeyL: 'L2', KeyA: 'L2', Semicolon: 'L2', KeyE: 'L1', KeyI: 'L1', KeyR: 'L0', KeyU: 'L0' };
    return { lv: lv };
  }
}
</script>
</body>
</html>

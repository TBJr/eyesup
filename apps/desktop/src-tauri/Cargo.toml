[package]
name = "eyesup"
version = "0.0.0"
description = "EyesUp desktop shell (Tauri 2)"
authors = ["EyesUp"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "eyesup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"

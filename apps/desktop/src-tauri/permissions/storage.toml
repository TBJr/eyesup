[[permission]]
identifier = "allow-storage-adapter"
description = "Allows EyesUp StorageAdapter SQLite invoke commands (EU-042)"
commands.allow = [
  "get_profile",
  "put_profile",
  "get_baseline",
  "put_baseline",
  "get_key_stats",
  "put_key_stat",
  "get_pair_stats",
  "put_pair_stat",
  "create_session",
  "update_session",
  "save_line_result",
  "list_sessions",
  "list_line_results",
  "put_milestone",
  "list_milestones",
  "list_own_texts",
  "put_own_text",
  "delete_own_text",
  "export_json",
  "import_json",
  "delete_everything"
]

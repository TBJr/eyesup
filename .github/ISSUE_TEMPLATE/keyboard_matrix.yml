name: Keyboard matrix result
description: Record a manual keyboard test matrix run on real hardware
title: "[matrix] "
labels: ["keyboard-matrix"]
body:
  - type: markdown
    attributes:
      value: |
        Use one issue per machine run. Attach or paste results from the keyboard test page when useful.
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: browser_or_app
    attributes:
      label: Browser or app version
      placeholder: Chromium 131 / EyesUp desktop 0.1.0
    validations:
      required: true
  - type: input
    id: physical_keyboard
    attributes:
      label: Physical keyboard
      placeholder: Apple Magic Keyboard (US)
    validations:
      required: true
  - type: dropdown
    id: layout
    attributes:
      label: Layout under test
      options:
        - qwerty-us
        - qwerty-uk
        - azerty-fr
        - other
    validations:
      required: true
  - type: textarea
    id: test_ids
    attributes:
      label: Test IDs K01–K18
      description: List each ID with pass, fail, or N/A and a short note.
      placeholder: |
        K01 pass
        K02 fail — note
        K14 N/A
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results summary
      description: Overall outcome, latency numbers for K14 if run, and anything unexpected.
    validations:
      required: true

name: Bug report
description: Something is broken or unexpected
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve EyesUp. Do not include typed practice text or keystroke logs.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reliably show the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser or app version, keyboard layout if relevant
      placeholder: macOS 15, Firefox 133, qwerty-us
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Extra notes
      description: Screenshots or other context (no keystroke data).

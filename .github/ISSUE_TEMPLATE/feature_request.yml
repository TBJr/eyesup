name: Feature request
description: Suggest an improvement that fits the product
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the backlog and Scope of Work first. Features outside the current phase may wait.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What learner or contributor problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about.

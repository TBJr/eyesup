name: Release

# Unsigned first milestone (EU-044). Signing steps run only when CI secrets exist.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate layouts
        run: pnpm validate-layouts

      - name: Tokens
        run: pnpm tokens

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests and coverage
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Size budget
        run: pnpm size

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: End-to-end
        run: pnpm test:e2e

  build-desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
            artifact: linux
          - platform: macos-latest
            args: ''
            artifact: macos
          - platform: windows-latest
            args: ''
            artifact: windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux webview deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Tokens + web build
        run: pnpm tokens && pnpm --filter @eyesup/web build

      - name: Build Tauri (unsigned)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Present only when the product owner has added signing secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}

      - name: Upload Linux packages
        if: matrix.artifact == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: eyesup-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

      - name: Upload macOS DMG
        if: matrix.artifact == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: eyesup-macos
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Upload Windows installers
        if: matrix.artifact == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: eyesup-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      # Code signing / updater artifacts — skipped until secrets exist (EU-045).
      - name: Note signing skipped
        if: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY == '' }}
        run: echo "TAURI_SIGNING_PRIVATE_KEY unset — shipping unsigned installers; see docs/release-runbook.md"

      - name: Prepare updater artifacts when signing key present
        if: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: echo "Signing key present — enable createUpdaterArtifacts and follow docs/desktop-updater.md"

  publish:
    needs: build-desktop
    runs-on: ubuntu-latest
    # Draft releases only from version tags; workflow_dispatch still runs test + build.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Checksums
        run: |
          mkdir -p release-files
          find dist-artifacts -type f -print0 | while IFS= read -r -d '' f; do
            cp "$f" "release-files/$(basename "$f")"
          done
          cd release-files
          if ls -A . >/dev/null 2>&1; then
            sha256sum * > ../SHA256SUMS.txt
            cp ../SHA256SUMS.txt .
          else
            echo "(no installer artifacts yet)" > ../SHA256SUMS.txt
            cp ../SHA256SUMS.txt .
          fi

      - name: Draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

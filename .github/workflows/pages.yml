name: Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install and build web app
        env:
          EYESUP_BASE_PATH: /eyesup/app/
        run: |
          pnpm install --frozen-lockfile
          pnpm tokens
          pnpm --filter @eyesup/web build

      - name: Assemble site
        run: |
          mkdir -p site/keyboard-test site/app
          cp site-public/index.html site/index.html
          cp tools/keyboard-test/index.html site/keyboard-test/index.html
          cp -R apps/web/dist/. site/app/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
